<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/pages/admin-pages/index}">
<head>
    <title>Product Form</title>
</head>
<body>
<div layout:fragment="content">

    <!-- Main content (added a little top padding to separate it from the master header) -->
    <section class="content" style="padding-top: 20px;">
        <div class="container-fluid">
            <div class="card card-primary">
                <div class="card-header">
                    <h3 class="card-title">Product Form</h3>
                </div>

                <!-- IMPORTANT: enctype="multipart/form-data" is required for files! -->
                <form th:action="${product.id == 0 ? '/product/create' : '/product/update/' + product.id}"
                      th:object="${product}" method="post" enctype="multipart/form-data">

                    <div class="card-body">
                        <div class="row">
                            <!-- LEFT COLUMN -->
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="name">Product Name</label>
                                    <input type="text" class="form-control" id="name" th:field="*{name}">
                                </div>

                                <div class="form-group">
                                    <label>Brand Name</label>
                                    <select class="form-control" th:field="*{brand.id}">
                                        <option th:each="b : ${brands}" th:value="${b.id}" th:text="${b.name}"></option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label style="margin-right: 15px;">Status</label>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" th:field="*{status}" id="active" value="true">
                                        <label class="form-check-label" for="active">Active</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" th:field="*{status}" id="inactive" value="false">
                                        <label class="form-check-label" for="inactive">Inactive</label>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label>Description</label>
                                    <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
                                </div>
                            </div>

                            <!-- RIGHT COLUMN -->
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="price">Price</label>
                                    <input type="number" step="0.01" class="form-control" id="price" th:field="*{price}">
                                </div>

                                <div class="form-group">
                                    <label for="stock">Stock</label>
                                    <input type="number" class="form-control" id="stock" th:field="*{stock}">
                                </div>

                                <div class="form-group">
                                    <label for="file">Photo</label>

                                    <div th:if="${product.photo != null}" class="mb-2 text-muted">
                                        <small>Current file: <span th:text="${product.photo}"></span></small>
                                    </div>

                                    <input type="file" class="form-control" id="file" name="file" style="padding: 3px;" accept="image/*">
                                    <small class="form-text text-muted">Leave blank to keep the current photo.</small>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card-footer" style="background-color: white;">
                        <button type="submit" class="btn btn-primary">Create</button>
                        <a th:href="@{/product}" class="ml-3">Back to List</a>
                    </div>
                </form>
            </div>
        </div>
    </section>
</div>
</body>
</html>
