<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/pages/admin-pages/index}">

<head>
    <meta charset="UTF-8">
    <title>Product List</title>
</head>

<body>

<section class="content" layout:fragment="content">

    <div class="card">

        <div class="card-header">

            <h3 class="card-title">
                <!-- Changed to /product/show -->
                <a th:href="@{/product/show}"
                   class="btn btn-primary btn-sm">
                    <i class="fas fa-plus"></i>
                    New
                </a>
            </h3>

            <div class="card-tools">
                <!-- Changed to /product -->
                <form th:action="@{/product}" method="get">
                    <div class="input-group input-group-sm" style="width:250px;">
                        <input type="text"
                               name="keyword"
                               class="form-control"
                               placeholder="Search..."
                               th:value="${keyword}">
                        <div class="input-group-append">
                            <button class="btn btn-default">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                    </div>
                </form>
            </div>

        </div>

        <div class="card-body table-responsive p-0">

            <table class="table table-hover text-nowrap">

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Product Name</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Photo</th>
                    <th>Status</th>
                    <th>Brand Name</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody>

                <!-- Loop through the products page content -->
                <tr th:each="product : ${products.content}">

                    <td th:text="${product.id}"></td>
                    <td th:text="${product.name}"></td>
                    <td th:text="${product.price}"></td>
                    <td th:text="${product.stock}"></td>
                    <td>
                        <img th:if="${product.photo != null}"
                             th:src="@{'/uploads/' + ${product.photo}}"
                             alt="Product Photo"
                             style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd;">

                        <span th:unless="${product.photo != null}" class="text-muted">No Photo</span>
                    </td>

                    <td th:text="${product.status ? 'Active':'Inactive'}"></td>

                    <td th:text="${product.brand != null ? product.brand.name : 'No Brand'}"></td>

                    <td>
                        <a th:href="@{/product/edit/{id}(id=${product.id})}"
                           class="btn btn-primary btn-sm">
                            <i class="fas fa-edit"></i>
                            Edit
                        </a>

                        <a th:href="@{/product/delete/{id}(id=${product.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure you want to delete this product?');">
                            <i class="fas fa-trash"></i>
                            Delete
                        </a>
                    </td>

                </tr>

                <!-- Safely check if there are zero items using totalItems -->
                <tr th:if="${totalItems == 0}">
                    <td colspan="7" class="text-center">
                        No data found.
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

        <div class="card-footer clearfix">

    <span class="float-left mt-2"
          th:text="'Total Items : ' + ${totalItems}">
    </span>

            <ul class="pagination pagination-sm m-0 float-right"
                th:if="${totalPages > 0}">

                <li class="page-item"
                    th:classappend="${currentPage == 1} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/product/page/{pageNo}(pageNo=${currentPage > 1 ? currentPage - 1 : 1},keyword=${keyword})}">
                        Previous
                    </a>
                </li>

                <li class="page-item"
                    th:each="i:${#numbers.sequence(1,totalPages)}"
                    th:classappend="${i==currentPage}?'active'">
                    <a class="page-link"
                       th:text="${i}"
                       th:href="@{/product/page/{pageNo}(pageNo=${i},keyword=${keyword})}">
                    </a>
                </li>

                <li class="page-item"
                    th:classappend="${currentPage==totalPages}?'disabled'">
                    <a class="page-link"
                       th:href="@{/product/page/{pageNo}(pageNo=${currentPage + 1},keyword=${keyword})}">
                        Next
                    </a>
                </li>

            </ul>

        </div>

    </div>

</section>

</body>
</html>
