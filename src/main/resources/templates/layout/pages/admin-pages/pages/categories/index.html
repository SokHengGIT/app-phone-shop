<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/pages/admin-pages/index}">

<head>
    <meta charset="UTF-8">
    <title>Category List</title>
</head>

<body>

<section class="content" layout:fragment="content">

    <div class="card">

        <div class="card-header">

            <h3 class="card-title">
                <a th:href="@{/category/show}"
                   class="btn btn-primary btn-sm">
                    <i class="fas fa-plus"></i>
                    New
                </a>
            </h3>

            <div class="card-tools">
                <form th:action="@{/category}"
                      method="get">
                    <div class="input-group input-group-sm"
                         style="width:250px;">
                        <input type="text"
                               name="keyword"
                               class="form-control"
                               placeholder="Search..."
                               th:value="${keyword}">
                        <div class="input-group-append">
                            <button class="btn btn-default">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                    </div>
                </form>
            </div>

        </div>

        <div class="card-body table-responsive p-0">

            <table class="table table-hover text-nowrap">

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Category Name</th>
                    <th>Status</th>
                    <th width="180">Action</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="category : ${categories.content}">

                    <td th:text="${category.id}"></td>

                    <td th:text="${category.name}"></td>

                    <td th:text="${category.status}"></td>

                    <td>

                        <a th:href="@{/category/edit/{id}(id=${category.id})}"
                           class="btn btn-primary btn-sm">
                            <i class="fas fa-edit"></i>
                            Edit
                        </a>

                        <a th:href="@{/category/delete/{id}(id=${category.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure you want to delete this category?');">
                            <i class="fas fa-trash"></i>
                            Delete
                        </a>

                    </td>

                </tr>

                <tr th:if="${categories.totalElements == 0}">
                    <td colspan="4"
                        class="text-center">
                        No data found.
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

        <div class="card-footer clearfix">

            <span class="float-left mt-2"
                th:text="'Total Items : ' + ${totalItems}">
            </span>

            <ul class="pagination pagination-sm m-0 float-right"
                th:if="${totalPages > 0}">

                <li class="page-item"
                    th:classappend="${currentPage == 1} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/category/page/{pageNo}(pageNo=${currentPage > 1 ? currentPage - 1 : 1},keyword=${keyword})}">
                        Previous
                    </a>
                </li>

                <li class="page-item"
                    th:each="i:${#numbers.sequence(1,totalPages)}"
                    th:classappend="${i==currentPage}?'active'">
                    <a class="page-link"
                       th:text="${i}"
                       th:href="@{/category/page/{pageNo}(pageNo=${i},keyword=${keyword})}">
                    </a>
                </li>

                <li class="page-item"
                    th:classappend="${currentPage==totalPages}?'disabled'">
                    <a class="page-link"
                       th:href="@{/category/page/{pageNo}(pageNo=${currentPage + 1},keyword=${keyword})}">
                        Next
                    </a>
                </li>

            </ul>

        </div>

    </div>

</section>

</body>

</html>
