<!-- The master wrapper WITH the fragment declaration -->
<div class="left-sidebar" th:fragment="left-sidebar">
  <h2>Category</h2>

  <!-- 1. Category Products (Dynamic) -->
  <div class="panel-group category-products" id="accordian">
    <div class="panel panel-default" th:each="category,state:${categories}">
      <div class="panel-heading">
        <h4 class="panel-title">
          <a data-toggle="collapse" data-parent="#accordian" th:href="|#sportswear${state.index}|">
            <span class="badge pull-right"><i class="fa fa-plus"></i></span>
            <span th:text="${category.getName()}">Sportswear</span>
          </a>
        </h4>
      </div>
      <div th:id="|sportswear${state.index}|" class="panel-collapse collapse">
        <div class="panel-body">
          <ul th:each="brand : ${category.getBrands()}">
            <li><a href="#" th:text="${brand.getName()}">Nike </a></li>
          </ul>
        </div>
      </div>
    </div>
  </div><!--/category-products-->

  <!-- 2. Brands -->
  <div class="brands_products">
    <h2>Brands</h2>
    <div class="brands-name">
      <ul class="nav nav-pills nav-stacked">
        <li><a href="#"> <span class="pull-right">(50)</span>Acne</a></li>
        <li><a href="#"> <span class="pull-right">(56)</span>Grüne Erde</a></li>
        <li><a href="#"> <span class="pull-right">(27)</span>Albiro</a></li>
        <li><a href="#"> <span class="pull-right">(32)</span>Ronhill</a></li>
        <li><a href="#"> <span class="pull-right">(5)</span>Oddmolly</a></li>
        <li><a href="#"> <span class="pull-right">(9)</span>Boudestijn</a></li>
        <li><a href="#"> <span class="pull-right">(4)</span>Rösch creative culture</a></li>
      </ul>
    </div>
  </div><!--/brands_products-->

  <!-- 3. Price Range (With the closed input tag!) -->
  <div class="price-range">
    <h2>Price Range</h2>
    <div class="well">
      <input type="text" class="span2" value="" data-slider-min="0" data-slider-max="600" data-slider-step="5" data-slider-value="[250,450]" id="sl2" /><br />
      <b>$ 0</b> <b class="pull-right">$ 600</b>
    </div>
  </div><!--/price-range-->

  <!-- 4. Shipping -->
  <div class="shipping text-center">
    <img th:src="@{/front-end-styles/images/home/shipping.jpg}" alt="Shipping" />
  </div><!--/shipping-->

</div> <!-- This closes the master wrapper! -->
